<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B7A43">
<meta name="robots" content="noindex">
<title>Parole Nuovissimo</title>
<style>
:root{--paper:#F6F7F4;--sheet:#fff;--ink:#1C2A22;--soft:#5B6A60;--g:#0B7A43;--r:#C8102E;--line:#D3DBD2}
@media (prefers-color-scheme:dark){:root{--paper:#121714;--sheet:#1A221D;--ink:#EAF0EB;--soft:#A3B0A7;--g:#5CCB8C;--r:#FF7F86;--line:#2E3A32;color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:linear-gradient(#BFDDEB,#F5E6C4);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);display:flex;align-items:center;justify-content:center;padding:16px}
@media (prefers-color-scheme:dark){body{background:linear-gradient(#16203A,#3B3350)}}
.box{position:relative;overflow:hidden;width:100%;max-width:380px;background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:30px 22px 22px;box-shadow:0 8px 24px rgba(0,0,0,.12);display:flex;flex-direction:column;gap:14px}
.box::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:linear-gradient(90deg,#009246 0 33.3%,#F4F5F0 33.3% 66.6%,#CE2B37 66.6%)}
h1{margin:0;font:700 26px/1.15 Georgia,"Times New Roman",serif}
h1 span{color:var(--g)}
p{margin:0;color:var(--soft);font-size:14px}
input[type=password]{font:500 18px ui-monospace,Menlo,Consolas,monospace;padding:12px 14px;border-radius:10px;border:2px solid var(--line);background:var(--paper);color:var(--ink);width:100%}
input[type=password]:focus{outline:3px solid var(--g);outline-offset:1px}
label.rem{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--soft)}
button{font:700 17px system-ui,sans-serif;border:0;border-radius:10px;padding:13px;background:var(--g);color:#fff;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{color:var(--r);font-weight:600;font-size:14px;min-height:20px}
.foot{font-size:12px;color:var(--soft);text-align:right}
</style>
</head>
<body>
<form class="box" id="f" autocomplete="off">
  <h1>Parole <span>Italiano ⇄ Greco</span></h1>
  <p>Inserisci il codice per entrare.</p>
  <input type="password" id="pw" aria-label="Codice" placeholder="Codice" autocomplete="current-password" autofocus>
  <label class="rem"><input type="checkbox" id="rem" checked> Ricorda su questo dispositivo</label>
  <div class="err" id="err" role="alert"></div>
  <button id="go" type="submit">Entra</button>
  <div class="foot">App di Foivos Kyrgios · © 2026 Dimitra Karabina e Foivos Kyrgios</div>
</form>

const u8=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u8(D.s),iterations:D.n,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u8(D.i)},key,u8(D.c));
  return new TextDecoder().decode(pt);
}
function show(html){document.open();document.write(html);document.close();}
const K='pn_code_'+D.s.slice(0,8);
const f=document.getElementById('f'),err=document.getElementById('err'),go=document.getElementById('go');
f.addEventListener('submit',async e=>{
  e.preventDefault();const pw=document.getElementById('pw').value;if(!pw)return;
  go.disabled=true;go.textContent='Controllo…';err.textContent='';
  try{const html=await open(pw);
    try{if(document.getElementById('rem').checked)localStorage.setItem(K,pw);else localStorage.removeItem(K);}catch(_){}
    show(html);
  }catch(_){err.textContent='Codice errato. Riprova.';go.disabled=false;go.textContent='Entra';}
});
(async()=>{let pw=null;try{pw=localStorage.getItem(K);}catch(_){}
  if(pw){go.disabled=true;go.textContent='Apertura…';try{show(await open(pw));}catch(_){try{localStorage.removeItem(K);}catch(__){}go.disabled=false;go.textContent='Entra';}}})();
</script>
